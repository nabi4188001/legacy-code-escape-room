name: list models

# Prints the model ids your provider key can use. Needs the repository secret LLM_API_KEY.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: OpenAI-compatible base URL of the provider
        default: https://generativelanguage.googleapis.com/v1beta/openai

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the agent
        run: mvn -B -q -f escape-agent/pom.xml package -DskipTests
      - name: List the models
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ inputs.base_url }}
        run: java -jar escape-agent/target/escape-agent.jar --list-models
